name: Deploy demo VM
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-vm-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: demo
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '51.195.137.119' }}
      SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY secret'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing SSH_KNOWN_HOSTS secret'; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          install -m 700 -d "$RUNNER_TEMP/poc-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/poc-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/poc-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/poc-ssh/"*
      - name: Prepare optional source API credentials
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/source_secrets.py
      - name: Transfer the verified commit and deploy
        run: |
          set -euo pipefail
          python3 scripts/deploy_config.py > .deploy.env
          tar --exclude=.git --exclude=.deploy.env --exclude=.source-secrets.env -czf "$RUNNER_TEMP/poc-source.tar.gz" .
          ssh_options=(-i "$RUNNER_TEMP/poc-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/poc-ssh/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p ~/search-services-poc'
          scp "${ssh_options[@]}" -P "$SSH_PORT" "$RUNNER_TEMP/poc-source.tar.gz" "$SSH_USER@$SSH_HOST:search-services-poc/source.tar.gz"
          scp "${ssh_options[@]}" -P "$SSH_PORT" .source-secrets.env "$SSH_USER@$SSH_HOST:search-services-poc/.source-secrets.env"
          scp "${ssh_options[@]}" -P "$SSH_PORT" .deploy.env "$SSH_USER@$SSH_HOST:search-services-poc/.deploy.env"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'cd ~/search-services-poc && tar -xzf source.tar.gz && bash scripts/deploy_vm.sh'
      - name: Verify the public endpoint from GitHub
        run: |
          set -euo pipefail
          if [ -n "$DEMO_DOMAIN" ]; then
            export POC_URL="https://$DEMO_DOMAIN"
          else
            export POC_URL="http://$SSH_HOST"
          fi
          python3 scripts/smoke.py
          python3 scripts/check_lab.py
          python3 scripts/check_observability.py
          python3 scripts/check_wikipedia.py
          python3 scripts/check_sources.py
          printf '### Demo verified\n\nURL: %s\n\nCommit: `%s`\n' "$POC_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Sample search latency during live ingestion
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/search-benchmark.json
        run: |
          if [ -n "$DEMO_DOMAIN" ]; then
            export POC_URL="https://$DEMO_DOMAIN"
          else
            export POC_URL="http://$SSH_HOST"
          fi
          python3 scripts/benchmark.py
      - name: Compare raw and scored search
        run: |
          if [ -n "$DEMO_DOMAIN" ]; then
            export POC_URL="https://$DEMO_DOMAIN"
          else
            export POC_URL="http://$SSH_HOST"
          fi
          python3 scripts/compare_search.py
      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/poc-ssh" .source-secrets.env
