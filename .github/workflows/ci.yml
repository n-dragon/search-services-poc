name: Verify POC
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  vespa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: DEMO_HOST=localhost docker compose -f compose.yaml -f compose.http.yaml -f compose.small.yaml up -d --build
      - run: python3 scripts/check_analytics.py
      - run: python3 scripts/smoke.py
      - run: POC_URL=http://localhost python3 scripts/smoke.py
      - if: failure()
        run: DEMO_HOST=localhost docker compose -f compose.yaml -f compose.http.yaml -f compose.small.yaml logs --no-color --tail=150
      - if: always()
        run: DEMO_HOST=localhost docker compose -f compose.yaml -f compose.http.yaml -f compose.small.yaml down -v
