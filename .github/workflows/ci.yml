name: Verify POC
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  vespa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: DEMO_HOST=localhost docker compose -f compose.yaml -f compose.http.yaml -f compose.small.yaml up -d --build
      - name: Verify worker and API SQLite volume sharing
        run: |
          DEMO_HOST=localhost docker compose --profile live -f compose.yaml -f compose.http.yaml -f compose.small.yaml run --rm --no-deps --build wikipedia python -c 'import time; from scripts.wikipedia import Store; from app.ingestion import database_path; s=Store(database_path()); s.enqueue("volume-probe"); s.mark(heartbeat=time.time())'
          python3 scripts/check_ingestion_volume.py
      - name: Verify structured feed, status volume and source filtering
        run: DEMO_HOST=localhost docker compose --profile live -f compose.yaml -f compose.http.yaml -f compose.small.yaml run --rm --no-deps --build structured python -m scripts.check_sources_fixture
      - run: python3 scripts/check_analytics.py
      - run: python3 scripts/smoke.py
      - run: python3 scripts/check_lab.py
      - run: python3 scripts/check_observability.py
      - run: POC_URL=http://localhost python3 scripts/smoke.py
      - if: failure()
        run: DEMO_HOST=localhost docker compose -f compose.yaml -f compose.http.yaml -f compose.small.yaml logs --no-color --tail=150
      - if: always()
        run: DEMO_HOST=localhost docker compose -f compose.yaml -f compose.http.yaml -f compose.small.yaml down -v
