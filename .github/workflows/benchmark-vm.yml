name: Benchmark demo VM
on:
  workflow_dispatch:
  # One-off run requested for this runner; restored to manual after dispatch.
  push:
    branches: [main]
    paths: [scripts/agentic_benchmark_vm.py]
permissions:
  contents: read
concurrency:
  group: demo-vm-benchmark
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  benchmark:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: demo
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '51.195.137.119' }}
      SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY secret'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing SSH_KNOWN_HOSTS secret'; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          install -m 700 -d "$RUNNER_TEMP/poc-benchmark-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/poc-benchmark-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/poc-benchmark-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/poc-benchmark-ssh/"*
      - name: Execute the read-only pilot on the VM
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/poc-benchmark-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/poc-benchmark-ssh/known_hosts" -o ConnectTimeout=15)
          scp "${ssh_options[@]}" -P "$SSH_PORT" scripts/agentic_benchmark_vm.py "$SSH_USER@$SSH_HOST:search-services-poc/scripts/agentic_benchmark_vm.py"
          ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd ~/search-services-poc && BENCHMARK_SOURCE_SHA=$GITHUB_SHA python3 -m scripts.agentic_benchmark_vm --base http://localhost:8000 --output-dir benchmark-results"
          scp "${ssh_options[@]}" -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:search-services-poc/benchmark-results/latest.json" "$RUNNER_TEMP/vm-benchmark-results.json"
      - name: Publish the execution summary
        env:
          BENCHMARK_REPORT: ${{ runner.temp }}/vm-benchmark-results.json
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['BENCHMARK_REPORT']).read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream:
              stream.write('## VM retrieval pilot\n\nExecuted on the demo VM, using loopback HTTP. No LLM QA score.\n\n')
              stream.write('| Profile | Requests | Errors | p50 (ms) | p95 (ms) |\n|---|---:|---:|---:|---:|\n')
              for row in report['summaries']:
                  stream.write(f"| {row['profile']} | {row['requests']} | {row['errors']} | {row['successful_p50_ms']} | {row['successful_p95_ms']} |\n")
              stream.write('\n### Experiment status\n\n')
              for item in report['experiments']:
                  stream.write(f"- **{item['id']} — {item['status']}**: {item['reason']}\n")
              stream.write('\n### Limits\n\n')
              for item in report['limits']:
                  stream.write('- '+item+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vm-retrieval-pilot
          path: ${{ runner.temp }}/vm-benchmark-results.json
          retention-days: 30
      - name: Remove runner SSH credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/poc-benchmark-ssh"
