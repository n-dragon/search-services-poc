services:
  vespa:
    image: vespaengine/vespa:8
    hostname: vespa
    volumes:
      - vespa-data:/opt/vespa/var
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped
  bootstrap:
    build: .
    command: ["python", "-m", "scripts.bootstrap"]
    environment:
      VESPA_URL: http://vespa:8080
      VESPA_CONFIG_URL: http://vespa:19071
    depends_on:
      vespa:
        condition: service_healthy
    restart: "no"
  web:
    build: .
    volumes:
      - analytics-data:/data
      - wikipedia-data:/ingestion
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VESPA_URL: http://vespa:8080
      WIKIPEDIA_DB: /ingestion/wikipedia.sqlite3
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
  wikipedia:
    profiles: [live]
    build: .
    command: ["python", "-m", "scripts.wikipedia"]
    environment:
      VESPA_URL: http://vespa:8080
      WIKIPEDIA_DB: /data/wikipedia.sqlite3
      WIKIPEDIA_LIMIT: "2000"
    volumes:
      - wikipedia-data:/data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
  analytics:
    build: .
    command: ["python", "-m", "uvicorn", "app.analytics:admin", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - analytics-data:/data
    restart: unless-stopped
volumes:
  wikipedia-data:
  analytics-data:
  vespa-data:
